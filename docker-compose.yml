version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: zerotrustapi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ownership:
    build:
      context: ./ownership
      dockerfile: Dockerfile
    container_name: zerotrustapi-ownership
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379
      - OWNERSHIP_PORT=4000
      - HOST=0.0.0.0
      - JWT_SECRET=development-secret
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  sample-app:
    build:
      context: ./sample-app
      dockerfile: Dockerfile
    container_name: zerotrustapi-sample-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - OWNERSHIP_BASE_URL=http://ownership:4000
      - JWT_SECRET=development-secret
      - APP_MODE=vulnerable
    depends_on:
      ownership:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
