version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: zerotrustapi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ownership:
    build:
      context: ./ownership
      dockerfile: Dockerfile
    container_name: zerotrustapi-ownership
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379
      - OWNERSHIP_PORT=4000
      - HOST=0.0.0.0
      - JWT_SECRET=development-secret
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  sample-app:
    build:
      context: ./sample-app
      dockerfile: Dockerfile
    container_name: zerotrustapi-sample-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - OWNERSHIP_BASE_URL=http://ownership:4000
      - JWT_SECRET=development-secret
      - APP_MODE=vulnerable
    depends_on:
      ownership:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  events:
    build:
      context: ./events
      dockerfile: Dockerfile
    container_name: zerotrustapi-events
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - MOCK_DATA=false
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: zerotrustapi-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - SAMPLE_APP_URL=http://sample-app:3000
      - REDIS_URL=redis://redis:6379
      - EVENTS_SERVICE_URL=http://events:5000/v1/events
      - JWT_SECRET=development-secret
    depends_on:
      redis:
        condition: service_healthy
      sample-app:
        condition: service_healthy
      events:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/_zt/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: zerotrustapi-dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      events:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
